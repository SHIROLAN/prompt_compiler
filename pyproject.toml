[project]
name = "prompt-compiler"
version = "0.1.0"
description = "A modular prompt compiler with analysis, optimization, validation, and HTTP access"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0.0",
  "uvicorn>=0.30.0",
  "typer>=0.12.0",
]

[project.scripts]
prompt-compiler = "prompt_compiler.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
